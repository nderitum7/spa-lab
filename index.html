
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Wordly Dictionary</h1>
        <p>Discover words, meanings, and pronunciation.</p>
        <button id="themeButton" type="button" aria-label="Toggle dark theme">
            Toggle Theme
        </button>
    </header>

    <main>
        <form id="searchForm">
            <label for="wordInput">Search for a word</label>
            <input
                type="text"
                id="wordInput"
                placeholder="Enter a word..."
                aria-label="Word to search"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="results" aria-label="Dictionary results"></section>

        <section id="favorites">
            <h2>Favorite Words</h2>
            <ul id="favoritesList"></ul>
        </section>
    </main>
</body>
</html>
